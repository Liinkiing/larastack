name: Internal

run_name: Internal ${{ inputs.platform }}

defaults:
  hooks:
    after_install_node_modules:
      - name: Generate GraphQL artifacts
        run: pnpm --filter @larastack/mobile run gen:gql

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platforms to distribute to internal testers
        options:
          - all
          - android
          - ios
        required: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: preview

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    if: ${{ inputs.platform != 'ios' }}
    type: get-build
    params:
      platform: android
      profile: internal
      distribution: store
      channel: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    if: ${{ inputs.platform != 'android' }}
    type: get-build
    params:
      platform: ios
      profile: internal
      distribution: store
      channel: internal
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: internal

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: internal

  submit_android:
    name: Submit Android build to internal testing
    needs: [build_android]
    type: submit
    params:
      profile: internal
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Submit iOS build to TestFlight
    needs: [build_ios]
    type: submit
    params:
      profile: internal
      build_id: ${{ needs.build_ios.outputs.build_id }}

  update_android:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: internal
      platform: android

  update_ios:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: internal
      platform: ios
