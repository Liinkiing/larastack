name: Production

run_name: Production ${{ inputs.platform }}

defaults:
  hooks:
    after_install_node_modules:
      - name: Generate GraphQL artifacts
        run: pnpm --filter @larastack/mobile run gen:gql

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Platforms to release
        options:
          - all
          - android
          - ios
        required: true

jobs:
  fingerprint:
    name: Fingerprint
    type: fingerprint
    environment: production

  get_android_build:
    name: Check for existing Android build
    needs: [fingerprint]
    if: ${{ inputs.platform != 'ios' }}
    type: get-build
    params:
      platform: android
      profile: production
      distribution: store
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Check for existing iOS build
    needs: [fingerprint]
    if: ${{ inputs.platform != 'android' }}
    type: get-build
    params:
      platform: ios
      profile: production
      distribution: store
      channel: production
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Build Android
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    name: Build iOS
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: production

  submit_android:
    name: Submit Android production draft
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}

  submit_ios:
    name: Submit iOS build
    needs: [build_ios]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}

  update_android:
    name: Publish Android update
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: android

  update_ios:
    name: Publish iOS update
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: production
    params:
      channel: production
      platform: ios
