name: 'larastack'
services:
  app:
    build:
      context: './vendor/laravel/sail/runtimes/8.5'
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: 'sail-8.5/app'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
    volumes:
      - '.:/var/www/html'
      # Lets `boost:update` resolve its '../.agents/skills' path to the workspace root.
      - '../.agents:/var/www/.agents'
    networks:
      - app
    depends_on:
      - pgsql
      - mailpit
      - redis
      - seaweedfs
  queue:
    image: 'sail-8.5/app'
    profiles:
      - workers
    command: sh docker/queue-worker.sh redis --sleep=0 --timeout=60
    working_dir: /var/www/html
    restart: 'on-failure:3'
    stop_grace_period: 90s
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
  realtime:
    image: 'sail-8.5/app'
    profiles:
      - workers
    command: sh docker/queue-worker.sh redis --queue=realtime --sleep=0 --timeout=60 --tries=3 --backoff=5 --max-time=3600
    working_dir: /var/www/html
    restart: 'on-failure:3'
    stop_grace_period: 90s
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
  scheduler:
    image: 'sail-8.5/app'
    profiles:
      - workers
    command: php artisan schedule:work
    working_dir: /var/www/html
    restart: 'on-failure:3'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
    networks:
      - app
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
  pgsql:
    image: 'postgres:18-alpine'
    ports:
      - '${FORWARD_DB_PORT:-5432}:5432'
    environment:
      PGPASSWORD: '${DB_PASSWORD:-password}'
      POSTGRES_DB: '${DB_DATABASE}'
      POSTGRES_USER: '${DB_USERNAME}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'pgsql:/var/lib/postgresql'
      - './vendor/laravel/sail/database/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
    networks:
      - app
    healthcheck:
      test: ['CMD', 'pg_isready', '-q', '-d', '${DB_DATABASE}', '-U', '${DB_USERNAME}']
      retries: 3
      timeout: 5s
  mailpit:
    image: 'axllent/mailpit:latest'
    ports:
      - '${FORWARD_MAILPIT_PORT:-1025}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      - app
  redis:
    image: 'redis:alpine'
    ports:
      - '${FORWARD_REDIS_PORT:-6379}:6379'
    volumes:
      - 'redis:/data'
    networks:
      - app
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      retries: 3
      timeout: 5s
  seaweedfs:
    image: 'chrislusf/seaweedfs:4.41'
    ports:
      - '127.0.0.1:${FORWARD_SEAWEEDFS_PORT:-8333}:8333'
      - '127.0.0.1:${FORWARD_SEAWEEDFS_ADMIN_PORT:-23646}:23646'
    environment:
      AWS_ACCESS_KEY_ID: '${AWS_ACCESS_KEY_ID:-sail}'
      AWS_SECRET_ACCESS_KEY: '${AWS_SECRET_ACCESS_KEY:-password}'
      S3_BUCKET: '${AWS_BUCKET:-larastack-local}'
    volumes:
      - 'seaweedfs:/data'
    networks:
      - app
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      retries: 10
      timeout: 5s
networks:
  app:
    driver: bridge
volumes:
  redis:
    driver: local
  pgsql:
    driver: local
  seaweedfs:
    driver: local
